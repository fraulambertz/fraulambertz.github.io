<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08132e">
  <meta name="description" content="Spielerisches Maus- und Tastaturtraining im Weltraum für Kinder von 10 bis 12 Jahren.">
  <title>Space Input Academy</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <header class="topbar">
    <button class="brand" id="homeButton" aria-label="Zur Startseite">
      <span class="brand-mark">S</span>
      <span><strong>MAUS &amp; TASTATUR</strong><small>TRAINING</small></span>
    </button>
    <button class="sound-button" id="soundButton" aria-pressed="false">
      <span id="soundIcon">♪</span><span id="soundLabel">Ton an</span>
    </button>
  </header>

  <main id="app" tabindex="-1">
    <section class="screen home-screen" id="homeScreen">
      <div class="mission-copy">
        <h1>Was möchtest du üben?</h1>
        <div class="best-row" id="bestRow"></div>
      </div>
      <div class="mission-grid">
        <button class="mission-card mouse-card" data-start="mouse-basic" aria-label="Maustraining Anfänger">
          <span class="orbit-icon" aria-hidden="true"><span>↖</span></span>
          <strong>Maustraining Anfänger</strong>
        </button>
        <button class="mission-card mouse-card pro-card" data-start="mouse-pro" aria-label="Maustraining Fortgeschrittene">
          <span class="orbit-icon" aria-hidden="true"><span>⊙</span></span>
          <strong>Maustraining Fortgeschrittene</strong>
        </button>
        <button class="mission-card keyboard-card" data-start="keyboard" aria-label="Tastaturtraining">
          <span class="key-icon" aria-hidden="true">A</span>
          <strong>Tastaturtraining</strong>
        </button>
      </div>
      <p class="desktop-note">Für Computer mit Maus oder Touchpad und deutscher Tastatur</p>
    </section>

    <section class="screen game-screen hidden" id="gameScreen" aria-live="polite">
      <div class="game-head">
        <button class="exit-button" id="exitButton">← Beenden</button>
        <div class="progress-wrap">
          <div class="progress-label"><span id="missionName">Mission</span><span id="stepLabel">1 / 7</span></div>
          <div class="progress"><span id="progressBar"></span></div>
        </div>
        <div class="timer" aria-label="Verstrichene Zeit"><span>◷</span> <b id="timer">00:00</b></div>
      </div>
      <div class="instruction-panel">
        <span class="instruction-icon" id="instructionIcon">↖</span>
        <div class="instruction-copy">
          <h2 id="taskTitle">Bereit?</h2>
          <p class="task-explanation" id="taskExplanation"></p>
          <p class="task-command" id="instruction"></p>
        </div>
      </div>
      <div class="playfield" id="playfield"></div>
      <div class="feedback" id="feedback" role="status"></div>
    </section>

    <section class="screen result-screen hidden" id="resultScreen">
      <div class="result-badge" id="resultBadge">★</div>
      <span class="eyebrow">MISSION GESCHAFFT</span>
      <h1 id="resultTitle">Stark geflogen!</h1>
      <p id="resultText"></p>
      <div class="result-stats">
        <div><strong id="resultScore">0</strong><span>Punkte</span></div>
        <div><strong id="resultAccuracy">0 %</strong><span>Genauigkeit</span></div>
        <div><strong id="resultTime">00:00</strong><span>Zeit</span></div>
      </div>
      <div class="result-actions">
        <button class="primary-button" id="replayButton">Noch einmal</button>
        <button class="secondary-button" id="resultHomeButton">Anderes Training</button>
      </div>
    </section>
  </main>

  <template id="continueTemplate">
    <button class="next-button">Weiter <span>→</span></button>
  </template>
  <script src="app.js"></script>
</body>
</html>
